<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
  <title id="title">StoreBridge system architecture and implemented AI product drafting flow</title>
  <desc id="desc">Layered architecture showing the customer storefront and merchant dashboard, the supplier-aware AI draft flow through an OpenAI-compatible gateway, human review, Saleor GraphQL, and the data and deployment foundations. A dashed lane identifies RAG and AI evaluation as planned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FAF9F6"/><stop offset="1" stop-color="#f0eee8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#001C5D" flood-opacity=".09"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#001C5D"/></marker>
    <marker id="goldArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#D79612"/></marker>
    <style>
      text{font-family:Manrope,Inter,Arial,sans-serif;fill:#001C5D}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px}.heading{font-size:28px;font-weight:800}.sub{font-size:14px;fill:#53617e}.layer{fill:#fffdfa;stroke:#d9dce4;stroke-width:1.3}.node{fill:#fff;stroke:#bfc7d8;stroke-width:1.2}.node-title{font-size:15px;font-weight:800}.node-copy{font-size:11px;fill:#596782}.tiny{font-size:10px;fill:#65718a}.lane{fill:#fbf7e9;stroke:#e4c46e;stroke-dasharray:7 6}.flow{fill:none;stroke:#001C5D;stroke-width:2.1;marker-end:url(#arrow)}.ai-flow{fill:none;stroke:#d79612;stroke-width:2.3;marker-end:url(#goldArrow)}.dash{fill:none;stroke:#98a2b6;stroke-width:1.6;stroke-dasharray:6 6}.chip{font-size:10px;font-weight:800;fill:#6a7487}.step{fill:#001C5D}.steptext{font-size:10px;font-weight:800;fill:#fff}.packet{fill:#F4B942;stroke:#fff;stroke-width:2}.state{font-size:10px;font-weight:800;fill:#4a5978}
    </style>
  </defs>
  <rect width="1440" height="920" rx="24" fill="url(#bg)"/>
  <text x="64" y="62" class="eyebrow">STOREFRONT · COMMERCE · AI-ASSISTED OPERATIONS</text>
  <text x="64" y="105" class="heading">StoreBridge system architecture</text>
  <text x="64" y="132" class="sub">Implemented supplier-to-product flow, with roadmap capabilities clearly marked.</text>
  <rect x="1138" y="48" width="238" height="38" rx="19" fill="#fff" stroke="#e2d7b9"/>
  <circle cx="1160" cy="67" r="5" fill="#F4B942"/><text x="1173" y="71" class="tiny" style="font-weight:800">ANIMATED · CURRENT FLOW</text>

  <!-- Experience -->
  <rect x="56" y="166" width="1328" height="124" rx="18" class="layer" filter="url(#shadow)"/>
  <text x="78" y="193" class="eyebrow">01 · EXPERIENCE</text>
  <rect x="81" y="211" width="366" height="58" rx="12" class="node"/>
  <text x="103" y="236" class="node-title">Customer storefront</text><text x="103" y="254" class="node-copy">Next.js · catalogue · cart · checkout · account</text>
  <rect x="493" y="211" width="422" height="58" rx="12" class="node"/>
  <text x="515" y="236" class="node-title">Merchant dashboard + product editor</text><text x="515" y="254" class="node-copy">Next.js server actions · review · explicit save</text>
  <rect x="961" y="211" width="390" height="58" rx="12" class="node"/>
  <text x="983" y="236" class="node-title">Merchant / customer</text><text x="983" y="254" class="node-copy">Browser session · Saleor identity · httpOnly cookies</text>
  <path d="M961 240H920" class="flow"/><text x="926" y="226" class="tiny">HTTPS</text>
  <path d="M493 240H457" class="flow"/><text x="458" y="226" class="tiny">published catalogue</text>

  <!-- AI and commerce -->
  <rect x="56" y="310" width="1328" height="354" rx="18" class="layer" filter="url(#shadow)"/>
  <text x="78" y="338" class="eyebrow">02 · APPLICATION + AI PRODUCT DRAFTING</text>
  <rect x="80" y="365" width="220" height="92" rx="13" class="node"/>
  <circle cx="101" cy="386" r="13" class="step"/><text x="97.5" y="390" class="steptext">1</text>
  <text x="122" y="390" class="node-title">Supplier input</text><text x="98" y="414" class="node-copy">URL · merchant text · optional image</text><text x="98" y="433" class="tiny">untrusted source, bounded fetch</text>

  <rect x="347" y="365" width="250" height="92" rx="13" class="node"/>
  <circle cx="369" cy="386" r="13" class="step"/><text x="365.5" y="390" class="steptext">2</text>
  <text x="390" y="390" class="node-title">Extract + augment prompt</text><text x="365" y="414" class="node-copy">OG / Twitter / JSON-LD / image heuristic</text><text x="365" y="433" class="tiny">bounded page text + Saleor category list</text>

  <rect x="647" y="365" width="220" height="92" rx="13" class="node"/>
  <circle cx="669" cy="386" r="13" class="step"/><text x="665.5" y="390" class="steptext">3</text>
  <text x="690" y="390" class="node-title">LLM inference</text><text x="665" y="414" class="node-copy">OpenAI-compatible gateway</text><text x="665" y="433" class="tiny">model alias: gemma · optional vision</text>

  <rect x="917" y="365" width="204" height="92" rx="13" class="node"/>
  <circle cx="939" cy="386" r="13" class="step"/><text x="935.5" y="390" class="steptext">4</text>
  <text x="960" y="390" class="node-title">Structured draft</text><text x="936" y="414" class="node-copy">Strict JSON Schema response</text><text x="936" y="433" class="tiny">listing · SEO · price · tags · category</text>

  <rect x="1170" y="365" width="188" height="92" rx="13" class="node"/>
  <circle cx="1192" cy="386" r="13" class="step"/><text x="1188.5" y="390" class="steptext">5</text>
  <text x="1213" y="390" class="node-title">Human review</text><text x="1189" y="414" class="node-copy">Merchant edits or declines</text><text x="1189" y="433" class="tiny">AI cannot publish</text>

  <path d="M300 411H338" class="ai-flow"/><path d="M597 411H638" class="ai-flow"/><path d="M867 411H908" class="ai-flow"/><path d="M1121 411H1161" class="ai-flow"/>
  <circle r="7" class="packet"><animateMotion dur="2.8s" repeatCount="indefinite" path="M300 411H338"/></circle>
  <circle r="7" class="packet"><animateMotion begin=".55s" dur="2.8s" repeatCount="indefinite" path="M597 411H638"/></circle>
  <circle r="7" class="packet"><animateMotion begin="1.1s" dur="2.8s" repeatCount="indefinite" path="M867 411H908"/></circle>
  <circle r="7" class="packet"><animateMotion begin="1.65s" dur="2.8s" repeatCount="indefinite" path="M1121 411H1161"/></circle>

  <rect x="224" y="493" width="410" height="102" rx="14" class="lane"/>
  <text x="246" y="519" class="eyebrow">ROADMAP · KNOWLEDGE RETRIEVAL</text>
  <text x="246" y="544" class="node-title">RAG components not implemented</text>
  <text x="246" y="565" class="node-copy">Chunking · embeddings · vector store · retrieval · reranking</text>
  <text x="246" y="581" class="tiny">No connection to the current inference path</text>
  <path d="M430 493V474H749V466" class="dash"/><text x="648" y="485" class="chip">future context source</text>

  <rect x="752" y="493" width="400" height="102" rx="14" class="node"/>
  <circle cx="778" cy="518" r="13" class="step"/><text x="774.5" y="522" class="steptext">6</text>
  <text x="801" y="522" class="node-title">Saleor GraphQL + media</text><text x="777" y="548" class="node-copy">Normal product mutation and media upload</text><text x="777" y="569" class="tiny">Saleor owns product, stock, checkout and orders</text>
  <path d="M1264 457V532H1160" class="ai-flow"/>
  <circle r="7" class="packet"><animateMotion begin="2.2s" dur="3.2s" repeatCount="indefinite" path="M1264 457V532H1160"/></circle>
  <path d="M752 544H646V269H447" class="flow"/><text x="654" y="531" class="tiny">published product</text>
  <circle r="7" class="packet"><animateMotion begin="2.8s" dur="4.2s" repeatCount="indefinite" path="M752 544H646V269H447"/></circle>

  <rect x="1180" y="493" width="178" height="102" rx="14" class="lane"/>
  <text x="1198" y="519" class="eyebrow">PLANNED</text><text x="1198" y="546" class="node-title">AI evaluation</text><text x="1198" y="567" class="node-copy">Dataset · regressions</text><text x="1198" y="583" class="tiny">No quality metrics today</text>

  <!-- Platform foundations -->
  <rect x="56" y="684" width="1328" height="166" rx="18" class="layer" filter="url(#shadow)"/>
  <text x="78" y="712" class="eyebrow">03 · PLATFORM FOUNDATIONS</text>
  <rect x="82" y="733" width="257" height="82" rx="12" class="node"/>
  <text x="103" y="760" class="node-title">FastAPI services</text><text x="103" y="782" class="node-copy">JWT/JWKS verification · wishlist · audit · health</text><text x="103" y="800" class="tiny">AI inference currently runs in Next.js server action</text>
  <rect x="371" y="733" width="281" height="82" rx="12" class="node"/>
  <text x="392" y="760" class="node-title">PostgreSQL · separate databases</text><text x="392" y="782" class="node-copy">Saleor commerce data | StoreBridge application data</text><text x="392" y="800" class="tiny">no direct StoreBridge writes to Saleor database</text>
  <rect x="684" y="733" width="228" height="82" rx="12" class="node"/>
  <text x="705" y="760" class="node-title">Redis + ARQ worker</text><text x="705" y="782" class="node-copy">Current job: audit-log pruning</text><text x="705" y="800" class="tiny">not an AI job queue yet</text>
  <rect x="944" y="733" width="190" height="82" rx="12" class="node"/>
  <text x="965" y="760" class="node-title">Operations</text><text x="965" y="782" class="node-copy">Structured logs · request IDs</text><text x="965" y="800" class="tiny">health/readiness · audit model</text>
  <rect x="1166" y="733" width="192" height="82" rx="12" class="node"/>
  <text x="1187" y="760" class="node-title">Delivery</text><text x="1187" y="782" class="node-copy">Docker Compose · GitHub Actions</text><text x="1187" y="800" class="tiny">nginx production-like config</text>
  <path d="M190 457V721" class="dash"/><path d="M1052 457V721" class="dash"/>
  <text x="79" y="884" class="tiny">Solid amber = current AI draft flow · dashed outlines = planned capability · no vector database, training pipeline or cost tracker is deployed</text>
</svg>
