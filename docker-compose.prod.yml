# Production overrides for a single shared host behind nginx.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Every port binds to 127.0.0.1; nginx (infrastructure/nginx/storebridge.conf) is the
# only public entry. Memory caps keep StoreBridge from starving other apps on the host.
# STOREBRIDGE_PUBLIC_URL and STOREBRIDGE_PUBLIC_HOST come from .env.

x-saleor-prod-env: &saleor-prod-env
  ALLOWED_HOSTS: localhost,127.0.0.1,saleor-api,${STOREBRIDGE_PUBLIC_HOST:?Set STOREBRIDGE_PUBLIC_HOST}
  ALLOWED_CLIENT_HOSTS: ${STOREBRIDGE_PUBLIC_HOST}
  # Media and thumbnail links handed to browsers; nginx forwards them to saleor-api.
  PUBLIC_URL: ${STOREBRIDGE_PUBLIC_URL:?Set STOREBRIDGE_PUBLIC_URL}/
  DEFAULT_FROM_EMAIL: StoreBridge <noreply@${STOREBRIDGE_PUBLIC_HOST}>
  # No mail server yet: emails are written to the worker log instead of sent.
  EMAIL_URL: consolemail://

services:
  postgres:
    mem_limit: 256m

  redis:
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru
    mem_limit: 64m

  # Development inbox only.
  mailpit:
    profiles: ["dev"]

  saleor-migrate:
    environment: *saleor-prod-env
    mem_limit: 512m

  saleor-api:
    environment: *saleor-prod-env
    ports: !override
      - "127.0.0.1:${SALEOR_API_PORT:-8200}:8000"
    mem_limit: 768m

  saleor-worker:
    environment: *saleor-prod-env
    mem_limit: 512m

  backend-migrate:
    environment:
      ENVIRONMENT: production
    mem_limit: 256m

  backend:
    environment:
      ENVIRONMENT: production
      CORS_ORIGINS: '["${STOREBRIDGE_PUBLIC_URL}"]'
    ports: !override
      - "127.0.0.1:${BACKEND_PORT:-8201}:8001"
    mem_limit: 256m

  worker:
    environment:
      ENVIRONMENT: production
    mem_limit: 192m

  frontend:
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3200}:3000"
    mem_limit: 256m

  saleor-dashboard:
    environment:
      API_URL: ${STOREBRIDGE_PUBLIC_URL}/graphql/
    ports: !override
      - "127.0.0.1:${SALEOR_DASHBOARD_PORT:-9200}:80"
