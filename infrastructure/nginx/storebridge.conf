# StoreBridge on a shared host. Copy to /etc/nginx/sites-available/storebridge and
# symlink into sites-enabled once the stack is running. Ports match docker-compose.prod.yml.
server {
    listen 8090;
    server_name _;

    client_max_body_size 20m;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Saleor: GraphQL API, uploaded media and generated thumbnails.
    location /graphql/ {
        proxy_pass http://127.0.0.1:8200;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:8200;
    }
    location /thumbnail/ {
        proxy_pass http://127.0.0.1:8200;
    }

    # Storefront and dashboard.
    location / {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
