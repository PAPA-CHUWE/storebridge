name: Community activity monitor

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    name: Check aggregate clones and public forks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out trusted repository scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Check notification secrets
        id: config
        env:
          TRAFFIC_API_TOKEN: ${{ secrets.TRAFFIC_API_TOKEN }}
          COMMUNITY_NOTIFY_TO: ${{ secrets.COMMUNITY_NOTIFY_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          missing=0
          for name in TRAFFIC_API_TOKEN COMMUNITY_NOTIFY_TO SMTP_HOST SMTP_PORT SMTP_USERNAME SMTP_PASSWORD SMTP_FROM; do
            if [ -z "${!name}" ]; then
              echo "::warning::Missing Actions secret: ${name}; community monitoring skipped."
              missing=1
            fi
          done
          if [ "$missing" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check community activity
        if: steps.config.outputs.ready == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          TRAFFIC_API_TOKEN: ${{ secrets.TRAFFIC_API_TOKEN }}
          COMMUNITY_NOTIFY_TO: ${{ secrets.COMMUNITY_NOTIFY_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 .github/scripts/community_activity.py monitor
