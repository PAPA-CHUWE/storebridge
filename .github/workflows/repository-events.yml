name: Repository community notifications

on:
  push:
    branches-ignore:
      - community-monitor-state
  fork:
  watch:
    types: [started]
  pull_request_target:
    types: [opened, reopened, closed]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  notify:
    name: Send repository event notification
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.action != 'closed' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pull_request_target intentionally checks out only the trusted base default branch.
      # Never fetch or execute code from the pull request head in this workflow.
      - name: Check out trusted repository scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Send event notification
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          COMMUNITY_NOTIFY_TO: ${{ secrets.COMMUNITY_NOTIFY_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: python3 .github/scripts/community_activity.py event
